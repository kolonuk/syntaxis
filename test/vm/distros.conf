# Upstream minimal cloud images used as VM base templates.
# Format: name|image URL|checksum file URL|image file name in checksum file
# Checksum file lines may be "hash  name", "hash *name" or "SHA256 (name) = hash".
# Add a line to add a distro; vmctl.sh fetch picks it up.
debian12|https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2|https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS|debian-12-genericcloud-amd64.qcow2
debian13|https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2|https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS|debian-13-genericcloud-amd64.qcow2
ubuntu2404|https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img|https://cloud-images.ubuntu.com/noble/current/SHA256SUMS|noble-server-cloudimg-amd64.img
rocky9|https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2|https://dl.rockylinux.org/pub/rocky/9/images/x86_64/CHECKSUM|Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
