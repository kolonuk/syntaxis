# Upstream minimal cloud images used as VM base templates.
# Format: name|directory URL|image file|checksum file
# The image is <directory URL>/<image file>; the checksum file sits in the same directory.
# Checksum file lines may be "hash  name", "hash *name" or "SHA256 (name) = hash".
# Add a line to add a distro; vmctl.sh fetch picks it up.
debian12|https://cloud.debian.org/images/cloud/bookworm/latest|debian-12-genericcloud-amd64.qcow2|SHA512SUMS
debian13|https://cloud.debian.org/images/cloud/trixie/latest|debian-13-genericcloud-amd64.qcow2|SHA512SUMS
ubuntu2404|https://cloud-images.ubuntu.com/noble/current|noble-server-cloudimg-amd64.img|SHA256SUMS
rocky9|https://dl.rockylinux.org/pub/rocky/9/images/x86_64|Rocky-9-GenericCloud-Base.latest.x86_64.qcow2|CHECKSUM
alma9|https://repo.almalinux.org/almalinux/9/cloud/x86_64/images|AlmaLinux-9-GenericCloud-latest.x86_64.qcow2|CHECKSUM
