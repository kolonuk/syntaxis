# SPDX-License-Identifier: GPL-2.0-or-later
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (embedded into the binary and used by tests)
        run: cd web && npm ci && npm run build
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Tests (what needs something real that is not here is skipped and listed below)
        run: go test -race -coverprofile=coverage.out -json ./... > results.json
      - name: Failed tests
        if: failure()
        run: |
          jq -r 'select(.Action=="fail" and .Test!=null) | "\(.Package) \(.Test)"' results.json
          jq -r 'select(.Action=="output") | .Output' results.json | grep -B2 -A14 -e '--- FAIL' -e 'DATA RACE' | head -200
      - name: What was not tested
        if: always()
        run: scripts/not-tested.sh results.json | tee -a "$GITHUB_STEP_SUMMARY"
      - run: go build -trimpath -o bin/syntaxis ./cmd/syntaxis

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Bundle size budget
        run: npm run budget

  checks:
    name: Workflow, Dockerfile and documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=   # the scripts are linted by shellcheck in the install job
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013
      - name: hadolint (sandbox image)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: images/sandbox/Dockerfile
          ignore: DL3008,DL3013   # distribution packages are unpinned on purpose: security updates come with a rebuild
      - name: Links in the documentation
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --timeout 30 --accept 200,403,429 README.md docs/*.md CHANGELOG.md
          fail: true

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans every commit in a push, so it needs their history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: govulncheck
        run: scripts/govulncheck.sh
      - name: npm audit
        run: cd web && npm ci && npm audit --omit=dev --audit-level=high   # shipped dependencies; dev tooling advisories are tracked by Dependabot
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # unfixed Docker-engine advisories are documented in docs/security.md
          exit-code: "1"
      - name: Secret scan of the repository
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image (no push on CI)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: syntaxis:ci
          build-args: |
            VERSION=ci-${{ github.run_number }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sandbox image (no push on CI)
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox
          push: false
          load: true
          tags: syntaxis-sandbox:ci
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: syntaxis:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  environments:
    name: Example environment images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (some of these images are several gigabytes)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker system df
      - name: Build the sandbox image
        run: docker build -q -t syntaxis-sandbox:ci images/sandbox
      - name: Build each environment on it, run it as the sandbox user, and remove it
        run: |
          for d in images/templates/*/; do
            t=$(basename "$d")
            echo "::group::$t"
            BASE=syntaxis-sandbox:ci sh scripts/build-templates.sh "$t" >/dev/null
            [ "$(docker run --rm "syntaxis-env-$t:1" id -u)" = 10001 ]
            sh scripts/build-templates.sh --remove "$t" >/dev/null
            docker builder prune -f >/dev/null
            echo "::endgroup::"
          done

  gvisor:
    name: gVisor integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gVisor and register it with Docker
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker version --format "docker {{.Server.Version}}"
          docker run --rm --runtime=runsc alpine:3.20 uname -a
      - name: Build sandbox image
        run: docker build -t syntaxis-sandbox:latest images/sandbox
      - name: Every test, against real Docker, real gVisor and the real internet
        env:
          SYNTAXIS_IT_EGRESS: "1"
        run: go test -count=1 -timeout 30m -json ./... > results.json
      - name: Failed tests
        if: failure()
        run: |
          jq -r 'select(.Action=="fail" and .Test!=null) | "\(.Package) \(.Test)"' results.json
          jq -r 'select(.Action=="output") | .Output' results.json | grep -B2 -A12 -e '--- FAIL' | head -150
      - name: What was not tested
        if: always()
        run: scripts/not-tested.sh results.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The same sandbox tests through the validating Docker proxy
        run: |
          go build -o bin/syntaxis ./cmd/syntaxis
          sudo ./bin/syntaxis docker-proxy -listen 127.0.0.1:2375 -network syntaxis-sandbox &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:2375/_ping && break; sleep 0.5; done
          # a privileged container must be refused
          if DOCKER_HOST=tcp://127.0.0.1:2375 docker run --rm --privileged -v /:/host alpine:3.20 true; then
            echo "the proxy allowed a privileged container"; exit 1
          fi
          DOCKER_HOST=tcp://127.0.0.1:2375 SYNTAXIS_IT_EGRESS=1 go test -count=1 -v \
            -run 'TestIntegration(GVisorIsolation|ForkBomb|Egress)' ./internal/sandbox/...

  install:
    name: Fresh install on a clean machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the shell scripts
        run: shellcheck -s sh scripts/*.sh
      - name: Run the installer (installs gVisor, builds, starts, firewall units, admin link)
        run: |
          sudo sh scripts/install.sh --yes --url http://localhost:8080 \
            --admin-email admin@example.com --llm 192.0.2.10 | tee install.log
      - name: Verify the result
        run: |
          set -x
          curl -fsS http://127.0.0.1:8080/healthz
          grep -q '#setup=' install.log                      # single-use admin link printed
          systemctl is-enabled syntaxis-egress.service syntaxis-egress.path syntaxis-egress.timer
          sudo nft list table inet syntaxis_sandbox | grep -q 'hook input'
          sudo grep -q '^SYNTAXIS_EGRESS_BLOCK=192.0.2.10/32' .env
          [ "$(stat -c %a .env)" = 600 ]
          sudo docker compose exec -T syntaxis syntaxis doctor > doctor.txt || true
          cat doctor.txt
          # the firewall is verified by a test sandbox and the strict Docker proxy is in front of Docker
          for check in sandbox.network-rules sandbox.socket-proxy sandbox.runsc; do
            if grep -q "$check" doctor.txt; then echo "unexpected finding: $check"; exit 1; fi
          done
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright flows and accessibility (axe) against the installed instance
        run: |
          # the installer's single-use admin link lets the tests make a signed-in admin and user
          export E2E_SETUP_TOKEN=$(grep -o '#setup=[A-Za-z0-9_-]*' install.log | head -1 | cut -d= -f2)
          cd web && npm ci && npx playwright install --with-deps chromium
          npm run e2e
      - name: Lighthouse (accessibility, best practices, SEO, performance) against the installed instance
        run: |
          export CHROME_PATH=$(cd web && node -e "console.log(require('@playwright/test').chromium.executablePath())")
          cd web && npm run lighthouse
      - name: Re-running the installer keeps settings and data
        run: |
          key=$(sudo grep '^SYNTAXIS_MASTER_KEY=' .env)
          sudo sh scripts/install.sh --yes > /dev/null
          [ "$(sudo grep '^SYNTAXIS_MASTER_KEY=' .env)" = "$key" ]
          curl -fsS http://127.0.0.1:8080/healthz
      - name: Updating from the development branch works and the update service is running
        run: |
          systemctl is-active syntaxis-update-agent.service
          sudo sh scripts/update.sh --dry-run --release v0.0.1 | grep -q 'channel=release target=v0.0.1 stream=stable'
          sudo sh scripts/update.sh --dry-run --release v0.0.1-rc.1 | grep -q 'stream=preview'
          sudo sh scripts/update.sh --dry-run --stream preview | grep -q 'channel=release .* stream=preview'
          sudo sh scripts/update.sh --dry-run --stream edge | grep -q 'channel=edge'
          sudo sh scripts/update.sh --edge
          curl -fsS http://127.0.0.1:8080/healthz
          [ "$(sudo grep '^SYNTAXIS_CHANNEL=' .env)" = "SYNTAXIS_CHANNEL=edge" ]
          [ "$(stat -c %a .env)" = 600 ]
      - name: Firewall comes back after it is flushed
        run: |
          sudo nft delete table inet syntaxis_sandbox
          sudo systemctl start syntaxis-egress.service
          sudo nft list table inet syntaxis_sandbox | grep -q 'hook input'
      - if: failure()
        run: sudo docker compose logs --tail 200; sudo journalctl -u syntaxis-egress --no-pager | tail -50

  installer:
    name: Installer on ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64, image: "debian:12" }
          - { runner: ubuntu-latest, arch: amd64, image: "ubuntu:22.04" }
          - { runner: ubuntu-latest, arch: amd64, image: "ubuntu:24.04" }
          - { runner: ubuntu-latest, arch: amd64, image: "almalinux:9" }
          - { runner: ubuntu-latest, arch: amd64, image: "rockylinux:9" }
          - { runner: ubuntu-24.04-arm, arch: arm64, image: "debian:12" }
          - { runner: ubuntu-24.04-arm, arch: arm64, image: "almalinux:9" }
    steps:
      - uses: actions/checkout@v7
      - name: Docker, nftables and gVisor install from their repositories
        run: docker run --rm -v "$PWD":/repo:ro ${{ matrix.image }} sh /repo/scripts/test-install-packages.sh
