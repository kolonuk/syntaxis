# SPDX-License-Identifier: GPL-2.0-or-later
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (embedded into the binary and used by tests)
        run: cd web && npm ci && npm run build
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath -o bin/syntaxis ./cmd/syntaxis

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: npm audit
        run: cd web && npm ci && npm audit --omit=dev --audit-level=high   # shipped dependencies; dev tooling advisories are tracked by Dependabot
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Secret scan of the repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image (no push on CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: syntaxis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sandbox image (no push on CI)
        uses: docker/build-push-action@v6
        with:
          context: images/sandbox
          push: false
          tags: syntaxis-sandbox:ci
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: syntaxis:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  gvisor:
    name: gVisor integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install gVisor and register it with Docker
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker run --rm --runtime=runsc alpine:3.20 uname -a
      - name: Build sandbox image
        run: docker build -t syntaxis-sandbox:latest images/sandbox
      - name: Isolation and containment tests against real gVisor
        run: SYNTAXIS_IT_EGRESS=1 go test -count=1 -v -run Integration ./internal/sandbox/... ./internal/server/...

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Start Syntaxis
        run: |
          go build -o bin/syntaxis ./cmd/syntaxis
          export SYNTAXIS_MASTER_KEY=$(./bin/syntaxis keygen)
          export SYNTAXIS_DATA_DIR=$RUNNER_TEMP/data SYNTAXIS_LOG_LEVEL=warn
          ./bin/syntaxis serve &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - run: cd web && npm run e2e
