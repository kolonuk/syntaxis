# SPDX-License-Identifier: GPL-2.0-or-later
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (embedded into the binary and used by tests)
        run: cd web && npm ci && npm run build
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath -o bin/syntaxis ./cmd/syntaxis
      - name: gVisor integration test (skipped when runsc is absent)
        run: go test -run Integration -v ./internal/sandbox/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: npm audit
        run: cd web && npm ci && npm audit --omit=dev --audit-level=high   # shipped dependencies; dev tooling advisories are tracked by Dependabot
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Secret scan of the repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image (no push on CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: syntaxis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sandbox image (no push on CI)
        uses: docker/build-push-action@v6
        with:
          context: images/sandbox
          push: false
          tags: syntaxis-sandbox:ci
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: syntaxis:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
