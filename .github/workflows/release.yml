# SPDX-License-Identifier: GPL-2.0-or-later
# Publishes images to GHCR when a version tag is pushed. Uses only the
# repository's built-in GITHUB_TOKEN; no other secrets are required.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          sbom: true
          provenance: true
      - name: Sandbox images, base first because the variants build on it
        run: |
          for v in sandbox sandbox-cloud sandbox-security; do
            docker buildx build --push --platform linux/amd64 --sbom=true --provenance=true \
              --build-arg BASE=ghcr.io/${{ github.repository }}-sandbox:${{ github.ref_name }} \
              -t ghcr.io/${{ github.repository }}-$v:${{ github.ref_name }} images/$v
          done
  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd web && npm ci && npm run build
      - name: Binaries and checksums
        run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/kolonuk/syntaxis/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/kolonuk/syntaxis/internal/buildinfo.Commit=${{ github.sha }}" -o dist/syntaxis-$os-$arch ./cmd/syntaxis
          done; done
      - name: SBOM of the source and its dependencies
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/syntaxis-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release notes from the changelog
        run: |
          # the section for this tag, or Unreleased if the tag has no section yet
          awk -v t="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (on) exit; if (index($0, "[" t "]") || index($0, "[v" t "]")) on=1; next }
            on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk '/^## \[Unreleased\]/{on=1; next} /^## /{if(on) exit} on' CHANGELOG.md > notes.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
