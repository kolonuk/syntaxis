# SPDX-License-Identifier: GPL-2.0-or-later
# Publishes images to GHCR when a version tag is pushed. Uses only the
# repository's built-in GITHUB_TOKEN; no other secrets are required.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          sbom: true
          provenance: true
      - name: Sandbox image variants
        run: |
          for v in sandbox sandbox-cloud sandbox-security; do
            docker buildx build --push --platform linux/amd64 \
              --build-arg BASE=ghcr.io/${{ github.repository }}-sandbox:${{ github.ref_name }} \
              -t ghcr.io/${{ github.repository }}-$v:${{ github.ref_name }} images/$v
          done
  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd web && npm ci && npm run build
      - run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/kolonuk/syntaxis/internal/buildinfo.Version=${{ github.ref_name }} -X github.com/kolonuk/syntaxis/internal/buildinfo.Commit=${{ github.sha }}" -o dist/syntaxis-$os-$arch ./cmd/syntaxis
          done; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
