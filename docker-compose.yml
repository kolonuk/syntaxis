# SPDX-License-Identifier: GPL-2.0-or-later
# One-command start:  cp .env.example .env && docker compose up -d
#
# The Syntaxis container never mounts the raw Docker socket. Only the socket
# proxy does, and it forwards an allow-list of API calls (containers, volumes,
# networks, images, exec). See docs/security.md for what this does and does not protect.
services:
  syntaxis:
    image: ghcr.io/kolonuk/syntaxis:latest
    build:
      context: .
      args:
        # for source builds: SYNTAXIS_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        VERSION: ${SYNTAXIS_VERSION:-dev}
        COMMIT: ${SYNTAXIS_COMMIT:-}
        DATE: ${SYNTAXIS_BUILD_DATE:-}
    restart: unless-stopped
    env_file: .env
    environment:
      SYNTAXIS_DOCKER_HOST: tcp://docker-socket-proxy:2375
      # the sandbox DNS resolver (domain policy, rebinding protection, query log) listens on this container's
      # address on the sandbox network; sandboxes are pointed at it
      SYNTAXIS_DNS_LISTEN: 172.30.0.2:53
      # inside the container both apps listen on all interfaces; what is reachable from outside is decided by the published ports below
      SYNTAXIS_LISTEN: 0.0.0.0:8080
      SYNTAXIS_ADMIN_LISTEN: 0.0.0.0:8081
      SYNTAXIS_SANDBOX_NETWORK: syntaxis-sandbox
    ports:
      - "${SYNTAXIS_CHAT_BIND:-0.0.0.0}:${SYNTAXIS_CHAT_PORT:-8080}:8080"   # chat app: put it behind a TLS reverse proxy
      - "${SYNTAXIS_ADMIN_BIND:-127.0.0.1}:${SYNTAXIS_ADMIN_PORT:-8081}:8081" # admin app: loopback by default; use a VPN/LAN address for remote admin
    volumes:
      - syntaxis-data:/data
    depends_on:
      - docker-socket-proxy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # to bind DNS port 53
    security_opt: ["no-new-privileges:true"]
    networks:
      control: {}
      sandbox:
        ipv4_address: 172.30.0.2

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      VOLUMES: 1
      NETWORKS: 1
      IMAGES: 1
      EXEC: 1
      INFO: 1
      VERSION: 1
      POST: 1
      # everything else stays at the proxy default (denied): swarm, services, secrets, plugins, build, commit, ...
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control]
    read_only: true
    tmpfs: [/run, /tmp]   # haproxy writes its generated config to /tmp

networks:
  control:
    internal: false
  sandbox:
    name: syntaxis-sandbox
    driver_opts:
      # ICC must stay on so sandboxes can reach the Syntaxis DNS resolver on this network.
      # Sandbox-to-sandbox traffic is dropped by the egress ruleset (see docs/getting-started.md),
      # which is verified by the integration tests.
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  syntaxis-data:
