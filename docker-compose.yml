# One-command start:  cp .env.example .env && docker compose up -d
#
# The Syntaxis container never mounts the raw Docker socket. Only the validating
# Docker proxy does (the docker-socket-proxy service below). See docs/security.md
# for what this does and does not protect.
services:
  syntaxis:
    image: ${SYNTAXIS_IMAGE:-ghcr.io/kolonuk/syntaxis:latest}
    build:
      context: .
      args:
        # for source builds: SYNTAXIS_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        VERSION: ${SYNTAXIS_VERSION:-dev}
        COMMIT: ${SYNTAXIS_COMMIT:-}
        DATE: ${SYNTAXIS_BUILD_DATE:-}
    restart: unless-stopped
    env_file: .env
    environment:
      SYNTAXIS_DOCKER_HOST: tcp://docker-socket-proxy:2375
      # the sandbox DNS resolver (domain policy, rebinding protection, query log) listens on this container's
      # address on the sandbox network; sandboxes are pointed at it
      SYNTAXIS_DNS_LISTEN: ${SYNTAXIS_SANDBOX_RESOLVER:-172.30.0.2}:53
      # inside the container both apps listen on all interfaces; what is reachable from outside is decided by the published ports below
      SYNTAXIS_LISTEN: 0.0.0.0:8080
      SYNTAXIS_ADMIN_LISTEN: 0.0.0.0:8081
      SYNTAXIS_SANDBOX_NETWORK: ${SYNTAXIS_SANDBOX_NETWORK:-syntaxis-sandbox}
    ports:
      - "${SYNTAXIS_CHAT_BIND:-0.0.0.0}:${SYNTAXIS_CHAT_PORT:-8080}:8080"   # chat app: put it behind a TLS reverse proxy
      - "${SYNTAXIS_ADMIN_BIND:-127.0.0.1}:${SYNTAXIS_ADMIN_PORT:-8081}:8081" # admin app: loopback by default; use a VPN/LAN address for remote admin
    volumes:
      - syntaxis-data:/data
    depends_on:
      - docker-socket-proxy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # to bind DNS port 53
    security_opt: ["no-new-privileges:true"]
    networks:
      control: {}
      sandbox:
        ipv4_address: ${SYNTAXIS_SANDBOX_RESOLVER:-172.30.0.2}

  docker-socket-proxy:
    # The validating Docker API proxy built into Syntaxis (`syntaxis docker-proxy`). It is
    # the only service with the socket. It refuses every endpoint Syntaxis does not use,
    # and validates container, exec, volume and network requests so that only hardened
    # gVisor sandboxes can be created or started: no privileged containers, host mounts,
    # host namespaces, extra capabilities or published ports. See docs/security.md.
    image: ${SYNTAXIS_IMAGE:-ghcr.io/kolonuk/syntaxis:latest}
    command: ["docker-proxy", "-listen", "0.0.0.0:2375", "-network", "${SYNTAXIS_SANDBOX_NETWORK:-syntaxis-sandbox}"]
    restart: unless-stopped
    user: "0:0"   # to open the root-owned socket; no capabilities are kept
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control]
    read_only: true
    cap_drop: [ALL]
    # label=disable lets this one container reach the socket on hosts with SELinux enforcing
    # (AlmaLinux, Rocky, RHEL, Fedora); it does nothing elsewhere
    security_opt: ["no-new-privileges:true", "label=disable"]

networks:
  control:
    internal: false
  sandbox:
    name: ${SYNTAXIS_SANDBOX_NETWORK:-syntaxis-sandbox}
    driver_opts:
      # ICC must stay on so sandboxes can reach the Syntaxis DNS resolver on this network.
      # Sandbox-to-sandbox traffic is dropped by the egress ruleset (see docs/getting-started.md),
      # which is verified by the integration tests.
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: ${SYNTAXIS_SANDBOX_SUBNET:-172.30.0.0/24}

volumes:
  syntaxis-data:
